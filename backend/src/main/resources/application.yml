
spring:
  application:
    name: groww-ai-options-trader

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${DB_USERNAME:GROWW_TRADER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: GROWW_TRADER
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    schemas: GROWW_TRADER
    default-schema: GROWW_TRADER

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${TRADING_MODEL_NAME:qwen2.5:7b}
          temperature: 0.0
          num-predict: 180

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

trading:
  ai:
    enabled: ${OLLAMA_ENABLED:true}
  mode: ${TRADING_MODE:PAPER}
  live-trading-enabled: ${LIVE_TRADING_ENABLED:false}
