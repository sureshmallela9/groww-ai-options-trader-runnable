spring:
  application:
    name: groww-ai-options-trader

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${DB_USERNAME:GROWW_TRADER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: GROWW_TRADER
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    schemas: GROWW_TRADER
    default-schema: GROWW_TRADER

groww:
  api:
    enabled: ${GROWW_API_ENABLED:true}
    base-url: ${GROWW_API_BASE_URL:https://api.groww.in}
    api-key: ${GROWW_API_KEY:}
    api-secret: ${GROWW_API_SECRET:}
    access-token: ${GROWW_ACCESS_TOKEN:}
    poll-interval: ${GROWW_POLL_INTERVAL:1000}

trading:
  internal-token: ${INTERNAL_API_TOKEN:}
  admin-token: ${TRADING_ADMIN_TOKEN:}
  session:
    calendar-file: ${TRADING_SESSION_CALENDAR:config/session-calendar.json}
  platform:
    monitor-enabled: true
    monitor-delay-ms: 1000
    outbox-delay-ms: 3000
  ai:
    enabled: ${TRADING_AI_ENABLED:true}
    analysis-url: ${TRADING_AI_ANALYSIS_URL:http://127.0.0.1:8000}
    timeout: ${TRADING_AI_TIMEOUT:20s}
    max-in-flight: ${TRADING_AI_MAX_IN_FLIGHT:12}
  backtest:
    charges-per-trade: ${PAPER_BACKTEST_CHARGES:5.00}
  mode: PAPER
  live-trading-enabled: false

server:
  address: ${TRADING_HOST:127.0.0.1}
  port: 1111

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
