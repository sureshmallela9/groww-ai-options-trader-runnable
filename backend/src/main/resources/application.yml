spring:
  application:
    name: groww-ai-options-trader

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${DB_USERNAME:GROWW_TRADER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: GROWW_TRADER
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    schemas: GROWW_TRADER
    default-schema: GROWW_TRADER

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${TRADING_MODEL_NAME:qwen2.5:7b}
          temperature: 0.0
          num-predict: 120
          keep-alive: 30m

groww:
  api:
    enabled: ${GROWW_API_ENABLED:false}
    base-url: ${GROWW_API_BASE_URL:https://api.groww.in}
    api-key: ${GROWW_API_KEY:}
    api-secret: ${GROWW_API_SECRET:}
    access-token: ${GROWW_ACCESS_TOKEN:}
    poll-interval: ${GROWW_POLL_INTERVAL:1000}

trading:
  ai:
    enabled: ${OLLAMA_ENABLED:true}
    timeout: 45s
  mode: PAPER
  live-trading-enabled: false

server:
  port: 1111

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics